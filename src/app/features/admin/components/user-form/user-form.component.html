<div class="form-wrapper">
  <form [formGroup]="form" class="user-form">
    <!-- ── Header ── -->
    <div class="form-header">
      <h3 class="form-title">
        <span *ngIf="mode === 'create'">Novo Usuário</span>
        <span *ngIf="mode === 'edit'">Editar Usuário</span>
        <span *ngIf="mode === 'view'">Visualizar Usuário</span>
      </h3>
      <span class="form-mode" [class]="'mode-' + mode">{{ mode }}</span>
    </div>

    <!-- ── Fields ── -->
    <div class="form-fields">
      <div class="field-group">
        <label class="form-label">Usuário</label>
        <input
          type="text"
          formControlName="username"
          [readonly]="mode === 'view'"
          placeholder="Nome de usuário"
          class="form-input" />
        <span class="field-error" *ngIf="form.get('username')?.hasError('required') && form.get('username')?.touched">
          Campo obrigatório
        </span>
        <span class="field-error" *ngIf="form.get('username')?.hasError('minlength') && form.get('username')?.touched">
          Mínimo 4 caracteres
        </span>
        <span class="field-error" *ngIf="form.get('username')?.hasError('usernameTaken') && form.get('username')?.touched">
          Usuário já existe
        </span>
      </div>

      <div class="field-group">
        <label class="form-label">Email</label>
        <input
          type="email"
          formControlName="email"
          [readonly]="mode === 'view'"
          placeholder="seu@email.com"
          class="form-input" />
        <span class="field-error" *ngIf="form.get('email')?.hasError('email') && form.get('email')?.touched">
          Email inválido
        </span>
      </div>

      <div class="field-group">
        <label class="form-label">Telefone (WhatsApp)</label>
        <input
          type="text"
          formControlName="phone"
          [readonly]="mode === 'view'"
          (input)="onPhoneInput($event)"
          (focus)="onPhoneFocus($event)"
          placeholder="+55 (11) 98765-4321"
          class="form-input" />
        <span class="field-error" *ngIf="form.get('phone')?.hasError('invalidPhone') && form.get('phone')?.touched">
          Formato inválido
        </span>
      </div>

      <div class="field-group" *ngIf="mode !== 'view'">
        <label class="form-label">{{ getPasswordLabel() }}</label>
        <input
          type="password"
          formControlName="password"
          [required]="mode === 'create'"
          placeholder="••••••••"
          class="form-input" />
        <span class="field-error" *ngIf="form.get('password')?.hasError('required') && form.get('password')?.touched">
          Campo obrigatório
        </span>
        <span class="field-error" *ngIf="form.get('password')?.hasError('minlength') && form.get('password')?.touched">
          Mínimo 6 caracteres
        </span>
      </div>

      <div class="field-group">
        <label class="form-label">Role / Permissão</label>
        <select
          formControlName="role"
          [disabled]="mode === 'view'"
          class="form-input form-select">
          <option *ngFor="let role of availableRoles" [value]="role" [selected]="role === form.get('role')?.value">
            {{ role }}
          </option>
        </select>
      </div>
    </div>

    <!-- ── Actions ── -->
    <div class="form-actions">
      <button
        type="button"
        class="btn-secondary"
        (click)="cancel.emit()">
        Voltar
      </button>

      <button
        type="button"
        class="btn-primary"
        (click)="submit()"
        [disabled]="form.invalid || form.pending || submitting || mode === 'view'">
        <span *ngIf="submitting">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="1"/><circle cx="12" cy="5" r="1"/><circle cx="12" cy="19" r="1"/>
          </svg>
        </span>
        {{ submitting ? 'Salvando...' : (mode === 'edit' ? 'Atualizar' : 'Criar') }}
      </button>
    </div>
  </form>
</div>
