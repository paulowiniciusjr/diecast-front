<div class="table-wrapper">
  <table class="vehicles-table">
    <thead>
      <tr>
        <th class="col-id">#</th>
        <th>Nome</th>
        <th>Escala</th>
        <th>Marca do Veículo</th>
        <th>Marca Diecast</th>
        <th>Cor</th>
        <th class="col-actions">Ações</th>
      </tr>
    </thead>

    <tbody>
      <tr *ngFor="let v of vehicles; let odd = odd" [class.row-odd]="odd">
        <td class="col-id">
          <span class="id-badge">{{ v.id }}</span>
        </td>
        <td class="col-name">{{ v.name }}</td>
        <td>
          <span class="scale-badge">{{ v.scale }}</span>
        </td>
        <td>{{ v.vehicleBrand }}</td>
        <td class="col-muted">{{ v.vehicleDiecastBrand }}</td>
        <td>
          <div class="color-cell">
            <span class="color-dot" [style.background]="v.color"></span>
            {{ v.color }}
          </div>
        </td>
        <td class="col-actions">
          <div class="action-buttons">
            <button
              type="button"
              class="action-btn action-btn--view"
              (click)="show.emit(v)"
              title="Visualizar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              Ver
            </button>

            <button
              type="button"
              class="action-btn action-btn--edit"
              (click)="edit.emit(v)"
              *ngIf="authService.isPermission()"
              title="Editar">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
              </svg>
              Editar
            </button>

            <button
              type="button"
              class="action-btn action-btn--delete"
              (click)="remove.emit(v)"
              *ngIf="authService.isPermission()"
              title="Excluir">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
                <path d="M10 11v6M14 11v6"/>
                <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
              </svg>
              Excluir
            </button>
          </div>
        </td>
      </tr>
    </tbody>
  </table>
</div>
